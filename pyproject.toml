[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "supadl"
version = "0.1.0.dev0"
description = "A reliable, modular, local-first download manager."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "SupaDL contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx[http2]>=0.28.1,<0.29",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.16.5,<0.17",
]

[project.scripts]
supadl = "supadl.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supadl = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
